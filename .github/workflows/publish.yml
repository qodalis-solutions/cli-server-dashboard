name: Publish
on:
  push:
    branches: [main]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run build -w portal
      - run: npm run build -w kit && npm run build -w modules/databases
      # @qodalis/cli-server-dashboard (the root), @qodalis/cli-server-portal (portal/), @qodalis/cli-server-dashboard-kit (kit/),
      # the dashboard modules the servers' plugins embed (modules/*: @qodalis/cli-dashboard-module-migrations)
      - name: Publish (skip versions already published)
        run: |
          for dir in . portal kit modules/databases; do
            PKG_NAME=$(node -p "require('./${dir}/package.json').name")
            PKG_VERSION=$(node -p "require('./${dir}/package.json').version")
            if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
              echo "${PKG_NAME}@${PKG_VERSION} already published — skipping."
            else
              (cd "${dir}" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
