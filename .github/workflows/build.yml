name: Build
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lints the dashboard and the portal (one ESLint config at the root)
      - run: npm run lint
      - name: Test (dashboard)
        run: npm test
      - name: Test (portal)
        run: npm test -w portal
      - name: Build (dashboard)
        run: npm run build
      - name: Build (portal)
        run: npm run build -w portal
      # The kit's own tests run with the dashboard's (kit/src); here its package and the example extension
      - name: Build (kit)
        run: npm run build -w kit && npm run build:example -w kit
